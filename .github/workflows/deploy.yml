# Deploys lexi-users-srl on every push to main: regenerates its route
# table from every endpoint folder's own endpoint.json, builds the zips,
# and applies ONLY this repo's infra/ — new functions, updated code,
# new/changed routes on the shared API Gateway. Never touches
# lexi-infra-aws (RDS, VPC, IAM, the API itself, the other two services):
# that stays a manual `terraform apply`, reviewed by hand.
#
# Needs, once this repo exists for real:
#   - lexi-infra-aws applied at least once (its outputs are what this reads)
#   - lexi-infra-aws/variables.tf's github_repo_users set to this repo, applied
#   - AWS_DEPLOY_ROLE_ARN set as a repository variable (the
#     github_actions_deploy_role_arns.users output from lexi-infra-aws)
name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lexi-users-srl
        uses: actions/checkout@v4
        with:
          path: cloud-native/lexi-users-srl

      # go.mod's `replace` directive expects this at ../../microservicios/lexi-users-ms
      # relative to cloud-native/lexi-users-srl — same layout as the local workspace.
      - name: Checkout lexi-users-ms
        uses: actions/checkout@v4
        with:
          repository: lucaslarroque95/lexi-users-ms
          path: microservicios/lexi-users-ms

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Regenerate routes from each endpoint's endpoint.json
        run: python3 generate_routes.py
        working-directory: cloud-native/lexi-users-srl

      - name: Build
        run: ./build.sh
        working-directory: cloud-native/lexi-users-srl

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: Terraform apply (this service's functions + routes only)
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
        working-directory: cloud-native/lexi-users-srl/infra
